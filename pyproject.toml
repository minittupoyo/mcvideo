[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcvideo"
version = "0.1.0"
description = "Play any video inside Minecraft: Java Edition with a generated datapack (blocks or particles)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []  # standard library only; needs ffmpeg and ffprobe on PATH

[project.scripts]
mcvideo = "mcvideo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcvideo = ["data/*.json"]
